<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BichinhoVirtual</title>
    <script>
      class BichinhoVirtual {
        constructor(nome) {
          this.nome = nome;
          this.nivelDeFome = 50;
          this.nivelFelicidade = 50;
          this.nivelDeCansaco = 50;
        }

        alimentar() {
          this.nivelDeFome -= 10;
          console.log(`${this.nome} foi alimentado. O nível de fome diminuiu.`);
        }

        brincar() {
          this.nivelFelicidade += 10;
          console.log(`${this.nome} está brincando e se sentindo mais feliz.`);
        }
        verificarStatus() {
          console.log(`Status atual de ${this.nome}:`);
          console.log(`Nível de fome: ${this.nivelDeFome}`);
          console.log(`Nível de felicidade: ${this.nivelFelicidade}`);
          console.log(`Nível de cansaço: ${this.nivelDeCansaco}`);
          console.log(`Idade: ${this.idade}`);
        }
        passarTempo() {
          this.nivelDeFome += 5;
          console.log(
            `${this.nome} está ficando mais faminto com o passar do tempo.`,
          );
        }
        cansaco() {
          this.nivelDeCansaco += 5;
          console.log(
            `${this.nome} está ficando mais cansado com o passar do tempo.`,
          );
        }
        descansar() {
          this.nivelDeCansaco -= 10;
          console.log(
            `${this.nome} descansou e está se sentindo mais energizado.`,
          );
        }
        idade() {
          console.log(`${this.nome} está envelhecendo com o tempo.`);
        }
      }
    </script>
    <script>
      console.log("Bem-vindo ao Simulador de Animal de Estimação Virtual!");
      const nomePet =
        prompt("Digite o nome do seu animal de estimação:") ||
        "Baltazar Guilherme Tenório";
      const pet = new BichinhoVirtual(nomePet);

      while (true) {
        const escolha = parseInt(
          prompt(
            `O que você deseja fazer com ${pet.nome}? \n 1. Alimentar \n 2. Brincar \n 3. Verificar o status \n 4. Sair`,
          ),
        );
        switch (escolha) {
          case 1:
            pet.alimentar();
            break;
          case 2:
            pet.brincar();
            break;
          case 3:
            pet.verificarStatus();
            break;
          case 4:
            console.log(
              "Saindo do Simulador de Animal de Estimação Virtual. Adeus!",
            );
            return;
          default:
            console.log("Escolha inválida. Tente novamente.");
        }

        pet.passarTempo();
      }
    </script>
  </head>

  <body></body>
</html>
