<html>
  <head>
    <script>
      // O código é todo modulado por funções para permitir uma organização melhor.

      // Uma lista de exemplo que podemos usar sem ter que informar usuários sempre.
      //var lista_hospedes = ["Gabriel Augusto", "Roberto Gómez Bolaños", "María Antonieta de las Nieves", "Hector Bonilha", "Carlos Villagrán", "Ramón Valdés"];

      var lista_hospedes = [];

      function sistema_cadastrar_hospedes() {
        var escolha_hospedes = parseInt(
          prompt(
            "Cadastro de Hóspedes\n\n Selecione uma opção: \n1. Cadastrar \n2. Pesquisar por nome exato \n3. Pesquisar por prefixo. \n4. Listar ordenado (A-Z) \n5. Atualizar cadastro. \n6. Remover cadastro \n7. Sair",
          ),
        );

        if (escolha_hospedes === 1) {
          cadastrar_hospedes();
        } else if (escolha_hospedes === 2) {
          pesquisar_hospedes();
        } else if (escolha_hospedes === 3) {
          pesquisar_hospedes_prefixo();
        } else if (escolha_hospedes === 4) {
          listar_hospedes();
        } else if (escolha_hospedes === 5) {
          atualizar_cadastro();
        } else if (escolha_hospedes === 6) {
          remover_cadastro();
        } else if (escolha_hospedes === 7) {
          alert("Saindo do sistema.");
          return;
        } else {
          erro_pesquisar_hospedes();
        }
      }

      function cadastrar_hospedes() {
        if (lista_hospedes.length >= 15) {
          alert("Numero máximo de hóspedes cadastrados.");
        } else {
          var nome_hospede = prompt("Por favor, informe o nome da(o) hóspede:");

          // Como a pesquisa exata pede apenas o nome, verificamos antes de colocar a data
          if (
            lista_hospedes.some((hospede) =>
              hospede.startsWith(nome_hospede + " -"),
            )
          ) {
            alert("Hóspede " + nome_hospede + " já está cadastrado(a).");
          } else {
            // Pega a data e hora do momento do cadastro
            var data_agora = new Date().toLocaleString();

            // Junta o nome e a data separados por um hífen
            var cadastro_completo = nome_hospede + " - " + data_agora;

            // Guarda o cadastro completo na lista
            lista_hospedes.push(cadastro_completo);

            alert(
              "Sucesso! Hóspede " +
                nome_hospede +
                " foi cadastrado(a) com sucesso!",
            );
          }
        }
        sistema_cadastrar_hospedes();
      }
      function pesquisar_hospedes() {
        var nome_hospede = prompt(
          "Por favor, informe o nome da(o) hóspede para pesquisa:",
        );
        var encontrado = lista_hospedes.some((hospede) =>
          hospede.startsWith(nome_hospede + " -"),
        );
        // O método includes() procura por um elemento dentro do Array e retorna verdadeiro ou falso. Caso queira comparar números, o mais indicado é o método find();
        if (encontrado) {
          alert(nome_hospede + " encontrada(o).");
        } else {
          alert(nome_hospede + " não foi encontrada(o).");
        }

        sistema_cadastrar_hospedes();
      }

      function pesquisar_hospedes_prefixo() {
        var nome_prefixo = prompt(
          "Por favor, informe o prefixo da(o) hóspede para pesquisa:",
        );
        var resultado = lista_hospedes.filter((hospedes) =>
          hospedes.startsWith(nome_prefixo),
        );
        if (resultado.length > 0) {
          alert("Hóspedes encontrados: " + resultado + "\n");
        } else {
          alert(
            "Nenhum hóspede encontrado com o prefixo '" + nome_prefixo + "'.",
          );
        }
        sistema_cadastrar_hospedes();
      }

      function listar_hospedes() {
        lista_hospedes.sort();

        var texto_listagem = "Lista de Hóspedes:\n\n";

        for (let i = 0; i < lista_hospedes.length; i++) {
          var nome = lista_hospedes[i];

          texto_listagem += i + 1 + " . " + nome + "\n";
        }

        alert(texto_listagem);

        sistema_cadastrar_hospedes();
      }

      function atualizar_cadastro() {
        var indice = parseInt(
          prompt("Digite o número do cadastro para atualizar"),
        );
        var indiceAtualizado = indice - 1;
        var nome_hospede = lista_hospedes[indiceAtualizado];
        if (indiceAtualizado >= 0 && indiceAtualizado < lista_hospedes.length) {
          alert(nome_hospede + " Escolhido");
          var nome_hospede = prompt("Por favor, informe o nome da(o) hóspede:");

          var data_agora = new Date().toLocaleString();

          var cadastro_completo = nome_hospede + " - " + data_agora;

          lista_hospedes[indiceAtualizado] = cadastro_completo;

          alert("Cadastro atualizado com sucesso!");
        } else {
          alert("Indice não foi encontrada(o).");
        }
        sistema_cadastrar_hospedes();
      }

      function remover_cadastro() {
        var indice = parseInt(
          prompt("Digite o número do cadastro para remoção:"),
        );
        var indiceAtualizado = indice - 1;

        if (indiceAtualizado >= 0 && indiceAtualizado < lista_hospedes.length) {
          lista_hospedes.splice(indiceAtualizado, 1);

          alert("Hóspede removido com sucesso!");
        } else {
          alert("Índice não foi encontrado.");
        }
        sistema_cadastrar_hospedes();
      }

      function erro_pesquisar_hospedes() {
        alert("Por favor, informe um número entre 1 e 7");
        sistema_cadastrar_hospedes();
      }

      sistema_cadastrar_hospedes();
    </script>
  </head>

  <body></body>
</html>
