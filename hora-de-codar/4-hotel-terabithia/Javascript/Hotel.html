        let senha = parseInt(prompt("Digite a senha para entrar"));

		if(senha === 2678){

}}
alert ("Sistema Bloqueado! Máximo de tentativas excedido.");
}
		function inicio() {
    
		alert ("Bem vindo ao " + hotel )

			var escolha = parseInt(prompt('Selecione uma opção 1.) Reserva de Quartos  2.) Cadastro de Hospedes 3.) Eventos 4.) Ar Condicionado 5.) Abastecer Carros 6.) Relatórios Operacionais 7.) Sair'));

			if (escolha === 1) {

			inicio();
		}

			alert('Por favor, informe um número entre 1 e 7');
			inicio();
		}

		function sair() {
			var confirma = confirm('Você deseja sair?');
			if (confirma) {

			}
		}

	 autenticar();
