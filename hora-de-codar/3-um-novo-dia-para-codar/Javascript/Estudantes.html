<!---### 1 - Estudantes
Crie um programa onde o usuário possa cadastrar estudantes sem limites, e, em seguida, 
Se o usuário digitar "PARE" o programa deve exibir a quantidade de estudantes cadastrados e a lista com cada um deles.-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudantes</title>
</head>
<body>
<script>
nome = prompt("Digite o nome do estudante");
let estudantes = [];



while (nome != "PARE" && nome != "pare"){

estudantes.push(nome);  
 nome = prompt("Digite o nome de outro estudante");






    
}

totalEstudantes = estudantes.length;
alert ("A quantidade de alunos cadastrados foi " + totalEstudantes + " os alunos cadastrados foram " + estudantes);

</script>
    
</body>
</html>
