<!--3.6. Leia 6 notas válidas (de 0 a 10), calcule e exiba a média simples.-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio3.6</title>
</head>
<body>
<script>
let soma = 0;

for(let i = 1; i <= 6; i++){
numero1 = parseFloat(prompt("Digite uma nota entre 0 a 10"));


while (numero1 < 0 || numero1 > 10 || (isNaN(numero1) || numero1 === '' )) {
alert("a nota não pode ser maior que 10 ou menor que 0");
numero1 = parseFloat(prompt("Digite uma nota entre 0 a 10"));
}
soma += numero1;
}
let media = (soma / 6);
alert ("A media desses números é " + media);



</script>
    
</body>
</html>
