
<!-- 3.8. Imprima os 10 primeiros números inteiros maiores que 100. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio3.8</title>
</head>
<body>
<script>
let contador = 0;
for (let i = 101; contador < 10; i++) {
    document.write(i + " - ");
    contador++;
}
</script>
    
</body>
</html>
</html>
