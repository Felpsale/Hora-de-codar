<html>

<head>

	<script>

	    // Aqui criamos uma variavel global. Global significa que o elemento pode ser acessado por qualquer método. Para tornar global, utilizamos a palavra static.
    
		var saldo = 100.5; // Float (Número com ponto flutuante)
		var nome = prompt("Digite seu nome:");
		if (nome === '' || nome === null) {
			alert('Por favor, informe seu nome:');
			nome = prompt("Digite seu nome:");
		}

		/*  Função principal. */
		function inicio() {
            //Ao acessar o sistema, pergunte o nome do usuário 
			alert('Olá ' + nome + ' é um prazer ter você por aqui!');
			var escolha = parseInt(prompt('Selecione uma opção 1) Saldo 2) Extrato 3) Saque 4) Depósito 5) Transferência e 6) Sair.'));
			//utilize escolha/caso (switch/case) para validar a opção escolhida pelo usuário.
			switch (escolha) {
				case 1:
					ver_saldo();
					break;
				case 2:
					fazer_extrato();
					break;
				case 3:
					fazer_saque();
					break;
				case 4:
					fazer_deposito();
					break;
				case 5:
					transferir();
					break;
				case 6:
					sair();
					break;
				default:
					erro();
			}
		}

		/*  Função principal. */
		function ver_saldo() {
			//Sempre que o usuário for acessar o saldo, sacar, retirar o extrato ou transferir dinheiro é necessário que ele informe uma senha.
			var senha = parseInt(prompt("Digite a senha de acesso"));
			if (senha === 3589){
			alert('Seu saldo atual é: ' + saldo);
			inicio();
			} else {
		alert("Senha Inválida")
		alert("Operação não autorizada")
		ver_saldo()
	 }
		}
		//Adicionar a opção para ver o extrato
		function fazer_extrato(){
			var senha = parseInt(prompt("Digite a senha de acesso"));
			if (senha === 3589){
				alert('Extrato da conta: Padaria Pão Doce: R$ 15,50, Supermercado: R$ 50,00, Farmácia: R$ 30,00');
				inicio();
			} else {
				alert("Senha Inválida");
				alert("Operação não autorizada");
				fazer_extrato();
			}
		}

		/*  Função para receber informado pelo usuário, processar e levar a uma mensagem de sucesso ou a repetição da função */
		function fazer_deposito() {
				var deposito = parseFloat(prompt('Qual o valor para depósito?')); 
			// Not a Number
			if (isNaN(deposito) || deposito === '') { // A Função isNaN checa se o valor informado é um Não-Número e retorna verdadeiro ou falso.
				alert('Por favor, informe um número:');
				fazer_deposito();
			} 
			//Caso o usuário informe um valor para depósito igual ou menor que zero, não deixe a operação ocorrer.
			else if (deposito <= 0) {
				alert('Operação não autorizada');
				alert('Por favor, informe um valor maior que zero:');
				fazer_deposito();
			}
			else {
				saldo += deposito;
				ver_saldo();
			}
			}
			
		/*  Função para receber informado pelo usuário, processar e levar a uma mensagem de sucesso ou a repetição da função */
		function fazer_saque() {
			//Sempre que o usuário for acessar o saldo, sacar, retirar o extrato ou transferir dinheiro é necessário que ele informe uma senha.
			var senha = parseInt(prompt("Digite a senha de acesso"));
			if (senha === 3589){
			var saque = parseFloat(prompt('Qual o valor para saque?'));
			if (isNaN(saque) || saque === '') {
				alert('Por favor, informe um número:');
				fazer_saque();
			} 
			//Sempre que o usuário for sacar dinheiro, o valor restante não pode ser negativo ou menor que zero
			else if (saldo < saque) {
				alert('Saldo insuficiente.' + ' Seu saldo atual é: ' + saldo);
				alert('Operação não autorizada');
				inicio();
			} else if (saque < 0) {
				alert('Operação não autorizada');
				alert('Por favor, informe um valor maior que zero:');
				fazer_saque();
			}
			else {
				saldo -= saque;
				ver_saldo();
			}
			}
			 else {
				alert("Senha Inválida");
				alert("Operação não autorizada");
				fazer_saque();
			}
			
		}
		function transferir() {
			//Adicionar a opção para fazer uma transferência.
			var senha = parseInt(prompt("Digite a senha de acesso"));
			if (senha === 3589){
			var conta = prompt('Qual o número da conta para transferência?');
			if (conta === '' || isNaN(conta)) {
				alert('Por favor, informe um número de conta:');
				transferir();
			}
			var transferencia = parseFloat(prompt('Qual o valor para transferência?'));
			if (isNaN(transferencia) || transferencia === '') {
				alert('Por favor, informe um número:');
				transferir();
			} 
			//Sempre que o usuário for transferir dinheiro, o valor a ser transferido não pode ser igual ou menor que zero
			else if (saldo < transferencia) {
				alert('Saldo insuficiente.');
				alert('Operação não autorizada');
				transferir();
			} else if (transferencia <= 0) {
				alert('Operação não autorizada');
				alert('Por favor, informe um valor maior que zero:');
				transferir();
			}
			else {
				saldo -= transferencia;
				ver_saldo();
			}
			}
			 else {
				alert("Senha Inválida");
				alert("Operação não autorizada");
				transferir();
			}
			
		}

		/* Verificar se há um erro */
		// informe um número entre 1 a 6
		function erro() {
			alert('Por favor, informe um número entre 1 a 6');
			inicio();
		}

		function sair() {
			var confirma = confirm('Você deseja sair?');
			if (confirma) {
			 alert(nome + ' Foi um prazer ter você aqui')
				window.close();
			} else {
				inicio();
			}
		}
inicio();
	</script>
</head>
